server:
  port: ${PORT:8080}
spring:
  application:
    name: fieldwork-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health
