server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}
spring:
  task:
    scheduling:
      pool:
        size: 2
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  application:
    name: fieldwork-backend
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  documents:
    batch-size: ${DOCUMENT_BATCH_SIZE:200}
    parallelism: ${DOCUMENT_PARALLELISM:2}
    zip-compression-level: ${DOCUMENT_ZIP_COMPRESSION_LEVEL:0}
    worker-delay-ms: ${DOCUMENT_WORKER_DELAY_MS:100}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}
management:
  endpoints:
    web:
      exposure:
        include: health
