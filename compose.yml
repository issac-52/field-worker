# 로컬 개발 전용. EC2의 /opt/field-work/compose.yml과 별개입니다.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fieldwork
      POSTGRES_USER: fieldwork
      POSTGRES_PASSWORD: fieldwork_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fieldwork_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fieldwork -d fieldwork"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  fieldwork_pgdata:
